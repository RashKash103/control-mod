name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      # The game and Blender aren't available on CI: tests that need them skip themselves.
      - name: Test
        run: uv run pytest -rs
      - name: CLI smoke test
        run: uv run control-mod --help

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Check the Blender script is packaged
        run: unzip -l dist/*.whl | grep -E "control_mod/blender/(ctl_blender|control_mod_tools).py" | wc -l | grep -qx 2
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
